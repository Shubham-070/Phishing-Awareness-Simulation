<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Login Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Roboto', sans-serif;
  background: #f1f3f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 12px;
  width: 350px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  text-align: center;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(15px);}
  to {opacity: 1; transform: translateY(0);}
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #1a73e8;
  margin-bottom: 10px;
}

h2 {
  font-weight: 400;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #dadce0;
  font-size: 14px;
}

input:focus {
  border-color: #1a73e8;
  outline: none;
}

button {
  width: 100%;
  padding: 12px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #1669c1;
}

.loading {
  display: none;
  margin-top: 10px;
  color: #555;
}

.notice {
  margin-top: 15px;
  font-size: 12px;
  color: red;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">GoogleMail</div>
  <h2 id="title">Sign in</h2>

  <!-- Step 1 -->
  <div id="step1">
    <input type="text" id="email" placeholder="Email">
    <button onclick="nextStep()">Next</button>
  </div>

  <!-- Step 2 -->
  <div id="step2" style="display:none;">
    <input type="password" placeholder="Password">
    <button onclick="submitForm()">Login</button>
  </div>

  <div class="loading" id="loading">Verifying...</div>

  <p class="notice">
    ⚠️ Demo for phishing awareness. No real data is collected.
  </p>

</div>

<script>
function nextStep() {
  let email = document.getElementById("email").value;
  if(email === "") {
    alert("Please enter email");
    return;
  }

  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
  document.getElementById("title").innerText = email;
}

function submitForm() {
  document.getElementById("loading").style.display = "block";

  setTimeout(() => {
    window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSepHOU3D8xkWBdaqMihzbc9Lcc8DogWbm-MaBv77TfB1EI2Yg/viewform?usp=pp_url&entry.469042495=Yes";
  }, 1500);
}
</script>

</body>
</html>
